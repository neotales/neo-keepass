# cargo-audit configuration (discovered at .cargo/audit.toml).
#
# This file records a reviewed triage decision. It does not hide anything:
# cargo-audit still prints every ignored advisory in every run, and the CI
# `audit` job still fails on any advisory not listed here. Each entry carries
# its assessment and the condition under which it must be re-evaluated.
[advisories]
# Triage 2026-11-16 — RUSTSEC-2023-0071 (Marvin Attack, rsa 0.9, fix >= 0.10.0):
# The advisory targets RSA *private-key* operations in `rsa` 0.9. This
# workspace performs none with that crate. Evidence (grep of the vendored
# sources at triage time):
#   - crates/neotales-age/src/crypto.rs `rsa_oaep_decrypt` converts every
#     private key to the maintained, Marvin-hardened `sad-rsa` implementation
#     and decrypts exclusively through its blinded path ("no raw or
#     variable-time private modular exponentiation is performed here").
#   - `rsa` 0.9 is used only for public-key work: PKCS#1 v1.5 signature
#     verification (crates/neotales-x509/src/ssh_cert.rs `verify_rsa`), OAEP
#     *encryption* (`rsa_oaep_encrypt`), and key parsing/serialization whose
#     private components are handed to `sad-rsa` (ssh_keypair.rs).
#   - No `.sign(`/decrypt call sites on `rsa` 0.9 private keys exist.
# Why not upgrade: `rsa` 0.10.0 removed the `sha2` feature the vendored crates
# depend on and requires migrating the vendored `neotales-age`/`neotales-x509`
# source — a cryptographic-code migration that must follow the vendored
# crates' upstream, not be improvised here.
# Remove this entry as soon as either holds: (1) the vendored crates upgrade
# to `rsa` >= 0.10, or (2) any private-key operation moves onto `rsa` 0.9 —
# at which point this ignore would be hiding a live vulnerability and must be
# deleted so the audit job fails again.
ignore = ["RUSTSEC-2023-0071"]
