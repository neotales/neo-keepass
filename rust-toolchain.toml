# The toolchain every developer and CI job uses.
#
# Pinned to an exact version rather than the stable channel, and aligned with
# `rust-version` in Cargo.toml (`neotales-keepass`, `neotales-age`, and
# `neotales-x509` declare `rust-version = "1.100"`).
#
# This file is read by rustup.
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt"]
profile = "minimal"

[env]
CARGO_INCREMENTAL = "0"
