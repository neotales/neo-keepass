[package]
name = "terminal-password"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Synchronous deadline-bounded terminal secret input"

[dependencies]
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["term", "poll", "signal", "process"] }
signal-hook = "0.3.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[lints.rust]
unsafe_code = "allow"
