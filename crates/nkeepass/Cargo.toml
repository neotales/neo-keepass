[package]
name = "nkeepass"
version = "0.0.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Headless KeePass automation CLI and TUI"

# The shipped executable is `nkp`. The package keeps the `nkeepass` crate
# name, which the library target, integration tests, and workspace
# references continue to use.
[[bin]]
name = "nkp"
path = "src/main.rs"

[dependencies]
neotales-keepass.workspace = true
neotales-age.workspace = true
base64.workspace = true
crossterm.workspace = true
arboard.workspace = true
getrandom.workspace = true
rpassword.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zeroize.workspace = true
terminal-password = { path = "../terminal-password" }

[dev-dependencies]
tempfile.workspace = true
syn.workspace = true
criterion.workspace = true
unicode-width = "0.2.3"

# Benchmark harness. `cargo bench` builds this with the pinned release profile
# and writes criterion output to target/criterion.
[[bench]]
name = "vault"
harness = false

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[target.'cfg(windows)'.dependencies]
known-folders = "1.4.2"
windows-clipboard = { path = "../windows-clipboard" }
windows-private-file = { path = "../windows-private-file" }


[lints]
workspace = true
