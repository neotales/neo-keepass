name: build

# Builds Linux amd64/arm64 release binaries and packaging artifacts
# (tar.gz, zip, deb) and uploads them as workflow artifacts.
#
# Builds run from a tag when triggered by tag push, from an explicit ref
# when dispatched, or from the event's merge commit on pull requests, so
# what ran is always a nameable commit. Nothing is published to any release
# or package registry; artifacts live only in the workflow run.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build (defaults to current branch)"
        required: false
        default: ""
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux (${{ matrix.target }})
    runs-on: ubuntu-24.04
    # The cross-compiled release build is the slow leg. Job-level only: the
    # build/package/validate steps get no step timeout (validate.sh already
    # bounds its binary smoke run with `timeout`), so a slow cold build can
    # never trip a premature bound. 60 is a conservative cap, not a
    # measured multiple.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            cross: false
            strip: strip
          - target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            cross: true
            strip: aarch64-linux-gnu-strip
    env:
      # Cross-linker only affects the aarch64 target; the native build ignores it.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      # cc-rs uses this target-specific variable when compiling C dependencies
      # such as ring; do not rely on Cargo's linker setting to select the C compiler.
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
    steps:
      # persist-credentials: false — pull-request builds compile PR-provided
      # code (including any build scripts it adds), so the checkout token
      # must not outlive checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin the build to the immutable event commit: pull_request gets its
          # merge commit SHA, tag pushes the tag's commit — never a movable
          # ref that could change mid-run. Only workflow_dispatch may select
          # an explicit ref; with an empty input it falls back to github.sha
          # (the dispatched branch head).
          persist-credentials: false
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.ref) || github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Record checked-out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          # Explicit dev package: --no-install-recommends omits it otherwise.
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Test aarch64 toolchain preflight guards
        if: matrix.cross
        run: scripts/test-preflight-aarch64-toolchain.sh
      - name: Preflight aarch64 C toolchain
        if: matrix.cross
        run: scripts/preflight-aarch64-toolchain.sh
      - name: Build release
        run: cargo build --release --locked -p nkeepass --target ${{ matrix.target }}
      - name: Strip binary
        run: ${{ matrix.strip }} "target/${{ matrix.target }}/release/nkp"
      - name: Package (tar.gz, zip, deb)
        run: |
          version=$(packaging/scripts/version.sh)
          dist="$PWD/dist"
          mkdir -p "$dist"
          packaging/scripts/archive.sh \
            "target/${{ matrix.target }}/release/nkp" \
            "$version" "${{ matrix.target }}" "$dist"
          packaging/deb/build.sh \
            "target/${{ matrix.target }}/release/nkp" \
            "$version" "${{ matrix.deb_arch }}" "$dist"
      - name: Validate artifacts
        run: |
          packaging/validate.sh --binary "target/${{ matrix.target }}/release/nkp" \
            "$PWD/dist" "$(packaging/scripts/version.sh)" "${{ matrix.target }}"
      - name: Prepare executable-only triage artifact
        run: |
          mkdir -p executable-artifact
          install -m 0755 "target/${{ matrix.target }}/release/nkp" executable-artifact/nkp
          (cd executable-artifact && sha256sum nkp > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nkp-linux-${{ matrix.deb_arch }}-${{ steps.revision.outputs.sha }}
          path: executable-artifact/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nkeepass-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS arm64 executable
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.ref) || github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: aarch64-apple-darwin
      - name: Record checked-out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build release
        run: cargo build --release --locked -p nkeepass --target aarch64-apple-darwin
      - name: Smoke-test executable
        run: target/aarch64-apple-darwin/release/nkp --help
      - name: Prepare executable-only triage artifact
        run: |
          mkdir -p executable-artifact
          install -m 0755 target/aarch64-apple-darwin/release/nkp executable-artifact/nkp
          (cd executable-artifact && shasum -a 256 nkp > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nkp-macos-arm64-${{ steps.revision.outputs.sha }}
          path: executable-artifact/*
          if-no-files-found: error
          retention-days: 14
