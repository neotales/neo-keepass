name: ci

# Test matrix across Windows/Linux/macOS, lint, packaging self-tests, and
# crate vulnerability audit.
#
# Windows includes native private-file integration tests in the test matrix.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  completion-interpreters:
    name: completion interpreters (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    # One debug test binary plus zsh/pwsh interpreter runs; 20 is a
    # conservative cap over a cold compile, not a measured multiple.
    timeout-minutes: 20
    env:
      NEO_KEEPASS_REQUIRE_COMPLETION_SHELLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh=5.9-6ubuntu2
          zsh --version | grep -F 'zsh 5.9'
      - name: Require pinned runner PowerShell
        run: >-
          pwsh -NoProfile -Command 'if ($PSVersionTable.PSVersion.ToString() -ne "7.6.10")
          { throw "PowerShell 7.6.10 is required for completion validation" };
          $PSVersionTable.PSVersion.ToString()'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - name: Run generated shell syntax tests
        # Executes a test binary that spawns zsh/pwsh interpreters; a missing
        # prompt can block forever, so the step is bounded tighter than the job.
        timeout-minutes: 15
        # Explicit shell: bash — the runner default is plain `bash -e`,
        # which has NO pipefail: a failing cargo piped through a
        # successful tee would yield the pipeline 0 and the step would
        # continue with cargo's exit code lost (verified locally:
        # without -o pipefail the pipeline reports 0; with it, 101).
        shell: bash
        run: |
          # Named-run guard, same as the macOS canary step: `cargo test
          # FILTER` exits 0 even when a renamed or mistyped filter matches
          # NO test. Assert the one intended test by its full printed
          # name and the exact expected run count. pipefail (from the
          # explicit shell: bash above) carries cargo's own exit code
          # through tee; every value here is a literal in this file.
          log="$(mktemp)"
          status=0
          cargo test -p nkeepass --bin nkp generated_zsh_and_powershell_scripts_parse_when_interpreters_are_installed 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::completion-interpreter cargo test exited $status; see the output above"
            exit "$status"
          fi
          if ! grep -q "^test completion::tests::generated_zsh_and_powershell_scripts_parse_when_interpreters_are_installed \.\.\. ok$" "$log"; then
            echo "::error::intended interpreter test did not run and pass: generated_zsh_and_powershell_scripts_parse_when_interpreters_are_installed (renamed, or filtered out?)"
            exit 1
          fi
          if ! grep -q "^test result: ok\. 1 passed; 0 failed; 0 ignored" "$log"; then
            echo "::error::expected exactly 1 passing test; see the output above"
            exit 1
          fi

  rsa-slow-lane:
    name: RSA 16,384-bit slow lane
    runs-on: ubuntu-24.04
    # Round trip against a committed 16,384-bit test vector; no key
    # generation happens at test time (see the fixture header in
    # crates/neotales-age/tests/rsa_16384.rs). The cost is deterministic,
    # slow-by-design RSA crypto — not a random prime-search draw. 40 is a
    # conservative cap, not a measured multiple.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run the ignored 16,384-bit RSA SSH round trip
        timeout-minutes: 30
        run: cargo test -p neotales-age --test rsa_16384 -- --ignored

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Generous cap for a cold build+test on the slowest runner in the
    # matrix. Without this, GitHub's default 360 applies — run
    # 134478538047 (macos-15) hung >75m in a Bash completion PTY test under
    # exactly that default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      # Untrusted pull-request code is compiled and run by this job; the
      # checkout token must not persist into those steps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1" # matches rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # CPython only exposed os.waitid on macOS starting in 3.13. The PTY
      # cleanup requires WNOWAIT to keep the session leader unreaped while
      # it owns the PGID; fail before cargo tests if this API is unavailable.
      - name: Install Python 3.13 for PTY process-group cleanup (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install python@3.13
          python_prefix="$(brew --prefix python@3.13)"
          python_bin="$python_prefix/bin/python3.13"
          "$python_bin" -c 'import os, sys; assert sys.version_info >= (3, 13), sys.version; assert callable(getattr(os, "waitid", None)) and hasattr(os, "WNOWAIT"), "os.waitid/WNOWAIT is required"; print(sys.version)'
          # Homebrew installs the versioned executable in bin/ but puts
          # the unversioned python3 shim in libexec/bin/ (see brew info).
          printf '%s\n' "$python_prefix/libexec/bin" >> "$GITHUB_PATH"
      # macOS still ships bash 3.2.57 as /bin/bash, which predates
      # `compopt` (new in bash 4.0 per bash-4.0's NEWS): the
      # hostile-filename readline matrix in
      # crates/nkeepass/src/completion.rs pins quoting behavior only a
      # bash >= 4 can express, and against 3.2 its candidates get
      # re-quoted and misplaced (proven on a readline-enabled bash
      # 3.2.57 build). Homebrew's bash (5.x) resolves first on the
      # runner PATH, so the PTY driver's execvp and the interactive
      # matrix reach it; the generated-script tests are pinned to the
      # native /bin/bash by the canary step below instead. The floor is
      # asserted, not the exact version pinned: brew bottles move, and
      # the requirement is the compopt contract, not one build. The
      # resolution check proves the PATH actually hands that bash to
      # the tests, and NEO_KEEPASS_REQUIRE_COMPLETION_BASH makes losing it
      # a loud matrix failure: without that flag a lost brew bash would
      # turn the matrix into a yield whose notice libtest captures and
      # never replays on a passing run.
      - name: Install modern bash for the completion matrix (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python_prefix="$(brew --prefix python@3.13)"
          resolved_python="$(command -v python3)"
          if [ "$resolved_python" != "$python_prefix/libexec/bin/python3" ]; then
            echo "::error::PATH resolves python3 to $resolved_python, not the checked Python 3.13 shim at $python_prefix/libexec/bin/python3"
            exit 1
          fi
          "$resolved_python" -c 'import os, sys; assert sys.version_info >= (3, 13), sys.version; assert callable(getattr(os, "waitid", None)) and hasattr(os, "WNOWAIT"), "os.waitid/WNOWAIT is required"; print("PTY Python:", sys.version)'
          brew install bash
          brew_prefix="$(brew --prefix)"
          resolved="$(command -v bash)"
          if [ "${resolved#"$brew_prefix"/}" = "$resolved" ]; then
            echo "::error::PATH resolves bash to $resolved, outside the Homebrew prefix $brew_prefix; the completion matrix would yield silently"
            exit 1
          fi
          major="$("$resolved" --version | sed -n 's/^GNU bash, version \([0-9][0-9]*\).*/\1/p')"
          if [ "${major:-0}" -lt 4 ]; then
            echo "::error::the PATH-resolved bash reports major ${major:-unknown}; the hostile-filename readline matrix needs bash >= 4 (compopt contract)"
            exit 1
          fi
          echo "NEO_KEEPASS_REQUIRE_COMPLETION_BASH=1" >> "$GITHUB_ENV"
          printf 'bash for the completion matrix: %s\n' "$("$resolved" --version | head -1)"
      # Windows runs unsuppressed. The first Windows run
      # failed in the Test step with exit code 101 (logs need authenticated
      # access, so the failing test is not identifiable from public data).
      # The three steps narrow, but do not conclusively distinguish, the
      # cause, and their boundaries are not what they may look like: Check
      # (cargo check --all-targets) type-checks every target including the
      # Windows-only cfg(windows) code - which never compiles anywhere else -
      # and does run dependency build scripts, but does not link. Test
      # compile (cargo test --no-run) fully builds the test binaries
      # including linking, but does not compile doctests. Test compiles and
      # runs the lib/bin/integration tests and additionally compiles and
      # runs doctests, so runtime failures and doctest compile errors both
      # surface only here. A Check failure is a compile defect; a
      # Test-compile failure is a test-binary build/link defect; a Test
      # failure with both predecessors green is an assertion failure, a
      # doctest compile error, or a runtime error.
      - name: Check
        shell: bash
        run: cargo check --workspace --all-targets
      - name: Test compile
        shell: bash
        run: cargo test --workspace --no-run
      - name: Windows private-write native canaries
        if: runner.os == 'Windows'
        shell: bash
        run: |
          run_canary() {
            local package="$1" target="$2" name="$3" output status=0
            if [ "$target" = lib ]; then
              output="$(cargo test -p "$package" --lib -- --exact "$name" 2>&1)" || status=$?
            else
              output="$(cargo test -p "$package" --test "$target" -- --exact "$name" 2>&1)" || status=$?
            fi
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ] || ! grep -q 'test result: ok\. 1 passed; 0 failed; 0 ignored' <<< "$output"; then
              echo "::error::Windows canary failed or did not run exactly once: $name"
              exit 1
            fi
          }
          run_canary nkeepass windows_private init_backup_context_mutation_and_no_clobber_are_private
          run_canary nkeepass windows_private mixed_case_environment_aliases_follow_precedence_and_cli_vault_wins
          run_canary nkeepass windows_private mixed_case_password_alias_unlocks_and_exec_reserves_aliases
          run_canary nkeepass windows_private mixed_case_config_and_data_aliases_beat_short_and_legacy_names
          run_canary nkeepass windows_private backup_failure_reports_partial_success_without_disclosing_password
          run_canary nkeepass windows_private config_replacement_failure_preserves_existing_data
          run_canary nkeepass windows_private existing_junction_target_is_not_replaced_or_followed
          run_canary nkeepass windows_private secure_directory_rejects_regular_file_without_changing_acl
          run_canary nkeepass windows_private concurrent_init_has_one_winner_without_clobber
          run_canary windows-private-file lib tests::unsupported_capability_rejects_before_returning_a_writer
          run_canary windows-private-file lib tests::administrator_directory_owner_is_accepted_by_owner_policy
          run_canary windows-private-file lib tests::failed_capability_query_keeps_os_error_without_exposing_it
          run_canary nkeepass lib private_file::tests::private_staging_rejects_inherited_everyone_access
          run_canary nkeepass lib private_file::tests::explicit_other_principal_grant_is_not_mistaken_for_owner_only
          echo "::notice::No real unsupported filesystem or elevated-owner fixture is provisioned; the capability and Administrators-owner policy are exercised synthetically."
      # Canary for the legacy bash the brew step displaced from this
      # leg's PATH: the generated-script tests otherwise exercise
      # Homebrew's 5.x here, and nothing in CI would keep testing the
      # script against the bash a stock macOS still ships. Pin the
      # parse, word-boundary, dynamic-path, and static command/option
      # vocabulary tests to the native /bin/bash through
      # NEO_KEEPASS_COMPLETION_BASH; the version assert keeps the canary
      # honest — if Apple ever replaces /bin/bash with a bash >= 4 the
      # step fails and the canary is revisited instead of silently
      # testing bash 5 twice. These are regression guards for what
      # works on the legacy bash today — parse, boundaries, the
      # while-read dynamic accumulators, and the static vocabulary the
      # completion reference documents as working there — NOT
      # completion parity: the interactive matrix on this leg runs
      # against the brew bash by design.
      - name: Canary - generated completion against the native /bin/bash (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # Executes compiled test code: bounded like every executing
        # step in this file, against an interpreter wedging on a prompt
        # that never returns.
        timeout-minutes: 10
        env:
          NEO_KEEPASS_COMPLETION_BASH: /bin/bash
        run: |
          major="$(/bin/bash --version | sed -n 's/^GNU bash, version \([0-9][0-9]*\).*/\1/p')"
          if [ "${major:-99}" -ge 4 ]; then
            echo "::error::the /bin/bash canary reports major ${major:-unknown}; it exists to keep exercising the legacy (pre-4) macOS bash"
            exit 1
          fi
          /bin/bash --version | head -1
          # Named-run guard: `cargo test FILTER` exits 0 even when a
          # renamed or mistyped filter matches NO test, so a green step
          # alone cannot prove the intended coverage ran. Assert each
          # intended test by its full printed name, plus the exact
          # expected run count. The explicit `shell: bash` above runs
          # `bash --noprofile --norc -eo pipefail`, so cargo's own
          # exit code survives the tee pipe (the runner default
          # `bash -e` has no pipefail and would swallow a failing
          # cargo behind a successful tee), and every value here is a
          # literal in this file — nothing from the event, inputs, or
          # the environment reaches this block.
          expected=(
            generated_bash_and_posix_scripts_parse_and_posix_files_group_completes
            bash_filename_completion_does_not_cross_command_or_option_value_boundaries
            bash_dynamic_completion_accumulates_candidates_without_mapfile
          )
          log="$(mktemp)"
          status=0
          cargo test -p nkeepass --bin nkp -- generated_bash_and_posix bash_filename_completion bash_dynamic_completion 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::canary cargo test exited $status; see the output above"
            exit "$status"
          fi
          for name in "${expected[@]}"; do
            if ! grep -q "^test completion::tests::${name} \.\.\. ok$" "$log"; then
              echo "::error::intended canary test did not run and pass: $name (renamed, or filtered out?)"
              exit 1
            fi
          done
          if ! grep -q "^test result: ok\. 3 passed; 0 failed; 0 ignored" "$log"; then
            echo "::error::canary expected exactly 3 passing tests; see the output above"
            exit 1
          fi
      # Windows pins the bash the tests see, the way the macOS canary
      # above pins /bin/bash. A bare `bash` on Windows can never resolve
      # to Git for Windows' bash: the CreateProcess search order checks
      # System32 before any PATH entry, so `bash.exe` there is always
      # the WSL launcher stub (run 44238368217's Windows job: exit 1,
      # "no installed distributions" in UTF-16 — a missing WSL distro is
      # an interpreter-availability fact, and the tests now report it as
      # one instead of mislabeling it a script or boundary failure).
      # Resolve the same standard Git for Windows locations the
      # test-side fallback probes, validate the binary reports GNU
      # bash, and pin it through NEO_KEEPASS_COMPLETION_BASH; the tests
      # keep honoring an explicit override first and fail closed with an
      # interpreter-availability diagnostic if nothing usable is found.
      - name: Pin the test bash to Git for Windows (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          program=""
          for candidate in \
            "/c/Program Files/Git/bin/bash.exe" \
            "/c/Program Files/Git/usr/bin/bash.exe" \
            "/c/Program Files (x86)/Git/bin/bash.exe" \
            "/c/Program Files (x86)/Git/usr/bin/bash.exe"
          do
            if [ -x "$candidate" ]; then
              program="$(cygpath -w "$candidate")"
              break
            fi
          done
          if [ -z "$program" ]; then
            echo "::error::no Git for Windows bash found in the standard install locations; the tests fail closed on interpreter availability"
            exit 1
          fi
          if ! version="$( "$program" --version | head -1 )"; then
            echo "::error::$program did not report a version"
            exit 1
          fi
          echo "resolved: $program"
          echo "version:  $version"
          case "$version" in
            "GNU bash, version"*) ;;
            *)
              echo "::error::resolved bash is not GNU bash: $version"
              exit 1
              ;;
          esac
          echo "NEO_KEEPASS_COMPLETION_BASH=$program" >> "$GITHUB_ENV"
      - name: Test
        shell: bash
        # Integration tests include PTY-style password prompts (#![cfg(unix)]);
        # a prompt that never returns blocks forever, as run 134478538047 did.
        # Bounded tighter than the job so a hang fails fast with a clear
        # timeout instead of consuming the whole job budget.
        timeout-minutes: 30
        run: cargo test --workspace

  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    # fmt is seconds; a cold clippy dominates the job. 30 is a conservative
    # cap, not a measured multiple.
    timeout-minutes: 30
    steps:
      # Untrusted pull-request code is compiled and run by this job; the
      # checkout token must not persist into those steps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
      # Rejects folded-scalar backslash continuations and bash -n fails.
      - name: workflow run blocks
        run: scripts/check-workflows.sh

  packaging-tests:
    name: packaging self-tests
    runs-on: ubuntu-24.04
    # Cold release build plus the self-tests that run its binary. 40 is a
    # conservative cap, not a measured multiple.
    timeout-minutes: 40
    steps:
      # Untrusted pull-request code is compiled and run by this job; the
      # checkout token must not persist into those steps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binary
        run: cargo build --release -p nkeepass
      # On ubuntu, dpkg-deb is available, so the positive deb is built by the
      # real builder and its metadata checked by dpkg-deb. The pacman builder
      # is skipped there (no makepkg) and exercised on Arch hosts instead.
      - name: Packaging self-tests
        # Runs the built binary many times; bounded against a binary that
        # blocks on input. The Build release step stays job-bounded only —
        # no premature compile-step timeout.
        timeout-minutes: 20
        run: packaging/test.sh target/release/nkp

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    # cargo-audit installs as a prebuilt binary; scan time rides on the
    # advisory-DB fetch, which is unpinned and network-dependent. 20 is a
    # conservative cap, not a measured multiple.
    timeout-minutes: 20
    steps:
      # Untrusted pull-request code is compiled and run by this job; the
      # checkout token must not persist into those steps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-audit
      # The lockfile pins the audited inputs, but results depend on the
      # advisory database at run time, so findings can change over time. The
      # current lockfile has no known findings in the audit database; keep the
      # job unsuppressed so future vulnerable dependencies fail visibly.
      - name: cargo audit
        run: cargo audit
