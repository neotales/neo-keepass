name: ci

# Test matrix across Windows/Linux/macOS, lint, and crate vulnerability audit.
#
# Windows caveat (documented, not suppressed): this checkout does not support
# owner-only secure writes on Windows - see README "Current status". Vault
# creation/mutation, config writes, and output-file tests can fail there by
# design because the code fails closed with an explicit
# unsupported-operation diagnostic. The Windows job is allowed to fail CI
# until that platform limitation is resolved; its failures are still reported
# and must not be silenced by skipping tests.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1" # matches rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Windows runs unsuppressed. Expect red on windows-2025 until the
      # platform limitation is resolved: owner-only secure writes are
      # unsupported on Windows (see README "Current status"), so tests that
      # exercise vault creation/mutation, config writes, or output files fail
      # closed with the explicit unsupported-operation diagnostic. Do not add
      # continue-on-error or skip lists here; the failure is the signal.
      - name: Test
        shell: bash
        run: cargo test --workspace

  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-audit
      # The lockfile is pinned, so advisory results are deterministic for a
      # given commit. This fails when there are vulnerabilities or unmaintained
      # crates with an RUSTSEC advisory; triage in Cargo.toml/Cargo.lock.
      - name: cargo audit
        run: cargo audit
