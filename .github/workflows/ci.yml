name: ci

# Test matrix across Windows/Linux/macOS, lint, packaging self-tests, and
# crate vulnerability audit.
#
# Windows note: the integration tests under crates/nkeepass/tests/ are
# #![cfg(unix)], so the Windows job runs the unit and doc tests only. The
# product-level limitation stands (owner-only secure writes are unsupported
# on Windows, README "Current status"); this job does not yet claim Windows
# coverage beyond that.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1" # matches rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Windows runs unsuppressed. Coverage there is narrow by design: the
      # integration test files under crates/nkeepass/tests/ are #![cfg(unix)]
      # (they exercise real file permissions and PTY-style password prompts),
      # so Windows runs the unit and doc tests only. The first Windows run
      # failed in the Test step with exit code 101 (logs need authenticated
      # access, so the failing test is not identifiable from public data).
      # The three steps narrow, but do not conclusively distinguish, the
      # cause, and their boundaries are not what they may look like: Check
      # (cargo check --all-targets) type-checks every target including the
      # Windows-only cfg(windows) code - which never compiles anywhere else -
      # and does run dependency build scripts, but does not link. Test
      # compile (cargo test --no-run) fully builds the test binaries
      # including linking, but does not compile doctests. Test compiles and
      # runs the lib/bin/integration tests and additionally compiles and
      # runs doctests, so runtime failures and doctest compile errors both
      # surface only here. A Check failure is a compile defect; a
      # Test-compile failure is a test-binary build/link defect; a Test
      # failure with both predecessors green is an assertion failure, a
      # doctest compile error, or a runtime error.
      - name: Check
        shell: bash
        run: cargo check --workspace --all-targets
      - name: Test compile
        shell: bash
        run: cargo test --workspace --no-run
      - name: Test
        shell: bash
        run: cargo test --workspace

  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
      # Rejects folded-scalar backslash continuations and bash -n fails.
      - name: workflow run blocks
        run: scripts/check-workflows.sh

  packaging-tests:
    name: packaging self-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binary
        run: cargo build --release -p nkeepass
      # On ubuntu, dpkg-deb is available, so the positive deb is built by the
      # real builder and its metadata checked by dpkg-deb. The pacman builder
      # is skipped there (no makepkg) and exercised on Arch hosts instead.
      - name: Packaging self-tests
        run: packaging/test.sh target/release/nkeepass

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-audit
      # The lockfile pins the audited inputs, but results depend on the
      # advisory database at run time, so findings are not reproducible across
      # time. The job fails when cargo audit reports vulnerabilities, as it
      # does today on RUSTSEC-2023-0071 (see docs/ci-cd.md for the reviewed
      # reachability and the unresolved upgrade). The fix is upgrading the
      # dependency — not an ignore, and not removing the job.
      - name: cargo audit
        run: cargo audit
