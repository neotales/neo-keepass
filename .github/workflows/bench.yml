name: bench

# Runs the criterion benchmarks and uploads the reports as artifacts.
# Manual trigger only: benchmarks are noisy and expensive for CI, so they run
# on demand rather than on every push.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to benchmark (defaults to current branch)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: criterion (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run benchmarks
        run: cargo bench -p nkeepass
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Function-call expression, exercised by scripts/check-workflows.sh
          # and actionlint: unique artifact name per run.
          name: ${{ format('criterion-reports-{0}', github.run_id) }}
          path: target/criterion
          if-no-files-found: error
