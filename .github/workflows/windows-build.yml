name: windows-build

# Manual/pull-request Windows x64 release build of the neo-keepass CLI
# (executable `nkp`).
#
# Produces nkp.exe, a zip archive, a sha256sum-compatible SHA256SUMS,
# and the platform limitations readme, uploaded as a workflow artifact.
# Nothing is published: no release, no tag, no secrets, no token beyond
# read-only checkout.
#
# Windows private-file behavior and scope are documented in the packaged
# WINDOWS-LIMITATIONS.txt and docs/ci-cd.md: protected current-user DACL writes
# are supported when persistent ACL enforcement and security verification
# succeed; failures reject the write. The documented path-based trust
# assumption and unverified platform configurations remain limitations.
#
# Checkout semantics are stricter than build.yml: the dispatch `ref` input
# must be a FULL 40-character lowercase hex commit SHA, matched against the
# ENTIRE string (no trimming, no case-folding). Branches, tags, uppercase
# and any padded or multiline value are rejected, so a run can never be
# repointed at a movable ref; the checked-out commit is always immutable and
# nameable. Pull requests build github.sha (the merge commit, also
# immutable).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full 40-character lowercase hex commit SHA to build (movable refs rejected)"
        required: true
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows x86_64 (msvc)
    runs-on: windows-2025
    # Cold MSVC build is the slow leg. Job-level only: no compile/package
    # step timeouts, and the packaging script tests plus the artifact smoke
    # run already enforce their own internal deadlines (see "Package and
    # verify artifact" below). 60 is a conservative cap, not a measured
    # multiple.
    timeout-minutes: 60
    steps:
      # The dispatch input is untrusted data and must never reach the shell
      # by ${{ }} interpolation; it crosses as an env var and is validated as
      # a WHOLE string: bash's =~ is unanchored by default, so the ^...$
      # anchors must cover every character — a payload with an embedded
      # newline or CR cannot match and no sub-line can sneak past.
      - name: Resolve and validate checkout commit
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ inputs.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              # github.sha for pull_request is the merge commit: immutable.
              ref=$EVENT_SHA
              ;;
            workflow_dispatch)
              ref=$DISPATCH_REF
              if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::ref input must be a full 40-character lowercase hex commit SHA (as git prints it); branches, tags, uppercase, padding and multiline values are rejected so the run is pinned to one immutable commit"
                exit 1
              fi
              ;;
            *)
              echo "::error::unexpected event for this workflow: $EVENT"
              exit 1
              ;;
          esac
          # Single exact output: the validated immutable SHA, nothing else.
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      # persist-credentials: false — pull-request builds compile PR-provided
      # code (including any build scripts it adds), so the checkout token
      # must not outlive checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Record checked-out revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0" # matches rust-toolchain.toml
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: x86_64-pc-windows-msvc

      - name: Build release (--locked)
        shell: bash
        run: cargo build --release --locked -p nkeepass --target x86_64-pc-windows-msvc

      - name: Validate PE machine is x64
        shell: bash
        run: pwsh -NoProfile -File packaging/scripts/windows-validate.ps1 -Binary "target/x86_64-pc-windows-msvc/release/nkp.exe" -Machine x64

      # Failure-path tests for the packaging scripts run in the real target
      # environment (the local dev host runs them under a portable pwsh; see
      # docs/ci-cd.md).
      - name: Run packaging script tests
        shell: bash
        run: pwsh -NoProfile -File packaging/scripts/test-windows-package.ps1

      # Package, then verify the produced artifact as a unit: whitelist the
      # zip manifest (exactly the four payloads under one named directory,
      # strict filenames, no traversal/duplicates/symlinks), check
      # central/local header agreement and entry types from the raw zip
      # bytes (data descriptors handled, non-regular types and empty
      # payloads rejected), verify every entry's CRC explicitly, extract,
      # re-validate the EXTRACTED exe as PE x64, check its sha256 equals
      # the binary just built, check the RAW top-level exe and limitations
      # copy the same way, check SHA256SUMS names (whitelisted before any
      # named file is read), reparse points and hashes, require the
      # canonical dist zip to BE the checked zip, and smoke-run the
      # EXTRACTED exe (--version, --help) under one deadline covering
      # execution and stream completion; cleanup is a separate bounded
      # allowance after it (terminate+join <=5s, pipe-drain joins <=2s
      # each) — on expiry the whole tree is killed. On Windows the child
      # is born into a kill-on-close job object (create-time assignment;
      # required, fail-closed if the job cannot be established), stdin is
      # a real NUL handle, and the smoke-ok line reports the containment
      # it actually got. A binary that failed any check is never executed,
      # and a mismatching artifact never reaches upload.
      - name: Package and verify artifact
        shell: bash
        run: |
          version=$(packaging/scripts/version.sh)
          triple=x86_64-pc-windows-msvc
          pwsh -NoProfile -File packaging/scripts/windows-package.ps1 \
            -Binary "target/$triple/release/nkp.exe" \
            -Version "$version" -Triple "$triple" -OutputDir dist
          pwsh -NoProfile -File packaging/scripts/windows-verify-artifact.ps1 \
            -Zip "dist/nkp-$version-$triple.zip" \
            -BuiltExe "target/$triple/release/nkp.exe" \
            -Version "$version" -Triple "$triple" -Smoke

      - name: Prepare executable-only triage artifact
        shell: bash
        run: |
          mkdir -p executable-artifact
          cp "target/x86_64-pc-windows-msvc/release/nkp.exe" executable-artifact/nkp.exe
          (cd executable-artifact && sha256sum nkp.exe > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nkp-windows-x86_64-${{ steps.revision.outputs.sha }}
          path: executable-artifact/*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nkeepass-x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error
          retention-days: 14
