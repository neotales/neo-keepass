[workspace]
members = [
    "crates/nkeepass",
    "crates/windows-clipboard",
    "crates/windows-private-file",
    "crates/neotales-keepass",
    "crates/neotales-age",
    "crates/neotales-x509",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/neotales/neo-keepass"

[workspace.dependencies]
aes = "0.9.2"
argon2 = "0.6.0"
base64 = "0.22"
blowfish = { version = "0.10.0", features = ["bcrypt"] }
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
chacha20 = { version = "0.10.2", features = ["cipher", "legacy", "xchacha"] }
chacha20poly1305 = { version = "0.11", features = ["reduced-round"] }
crossterm = "=0.29.0"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
ctr = "0.10.1"
des = { version = "0.9.0", features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8"] }
flate2 = "1.1"
getrandom = "0.3"
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["sys_rng"] }
hkdf = "0.13.0"
hmac = "0.13"
hpke = { version = "0.14.1", features = ["nistp"] }
md-5 = "0.11.0"
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
p256 = "0.14.0"
p384 = "0.14.0"
p521 = "0.14.0"
quick-xml = "0.42"
rcgen = { version = "0.14.7", features = ["zeroize", "x509-parser"] }
rsa = "0.10.0"
salsa20 = "0.11"
scrypt = "0.12.0"
sha1 = "0.11.0"
sha2 = "0.11"
subtle = "2.6.1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-human-readable", "formatting", "macros"] }
zeroize = { version = "=1.9.1", features = ["derive"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
tempfile = "3.24"
criterion = "0.8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
rpassword = "7.4"
syn = { version = "2.0", features = ["full", "parsing"] }
neotales-age = { path = "crates/neotales-age", version = "0.0.0-alpha.1" }
neotales-keepass = { path = "crates/neotales-keepass", version = "0.0.0-alpha.3" }
neotales-x509 = { path = "crates/neotales-x509", version = "0.0.0-alpha.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
