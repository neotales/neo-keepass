[workspace]
members = [".", "neotales-keepass"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/neotales/neokeepass"

[workspace.dependencies]
aes = "0.9.2"
argon2 = "0.6.0"
base64 = "0.22"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
chacha20 = { version = "0.10.2", features = ["cipher", "legacy", "xchacha"] }
crossterm = "=0.29.0"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
flate2 = "1.1"
getrandom = "0.3"
hmac = "0.13"
quick-xml = "0.42"
sha1 = "0.11.0"
salsa20 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-human-readable", "formatting", "macros"] }
zeroize = { version = "1.9", features = ["derive"] }
tempfile = "3.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
rpassword = "7.4"
syn = { version = "2.0", features = ["full", "parsing"] }
neotales-keepass = { path = "neotales-keepass", version = "0.0.0-alpha.3" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[package]
name = "nkeepass"
version = "0.0.0-alpha.25"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Headless KeePass automation CLI and TUI"

[dependencies]
neotales-keepass.workspace = true
base64.workspace = true
crossterm.workspace = true
arboard.workspace = true
getrandom.workspace = true
rpassword.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
syn.workspace = true

[target.'cfg(windows)'.dependencies]
known-folders = "1.4.2"
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory"] }
