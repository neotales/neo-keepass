[workspace]
members = [
    "crates/nkeepass",
    "crates/windows-clipboard",
    "crates/windows-private-file",
    "crates/terminal-password",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/neotales/neo-keepass"

[workspace.dependencies]
base64 = "0.22"
crossterm = "=0.29.0"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
getrandom = "0.3"
zeroize = { version = "=1.9.1", features = ["derive"] }
tempfile = "3.24"
criterion = "0.8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
rpassword = "7.4"
syn = { version = "2.0", features = ["full", "parsing"] }
neotales-age = "0.0.0-alpha.2"
neotales-keepass = "0.0.0-alpha.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
